name: NFCRename
options:
  bundleIdPrefix: com.jk
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions: [en, ko]

targets:
  NFCRename:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Service
      - path: Sources/UI
    resources:
      - path: Sources/Resources/Assets.xcassets
      - path: Sources/Resources/ko.lproj
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jk.nfc-rename
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Sources/App/Info.plist
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: "1.1.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: Sources/App/NFCRename.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5AVW8WCFJ2
        ENABLE_HARDENED_RUNTIME: true
