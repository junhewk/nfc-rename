name: NFCRename
options:
  bundleIdPrefix: com.jk
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:
  NFCRename:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Service
      - path: Sources/UI
    resources:
      - path: Sources/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jk.nfc-rename
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Sources/App/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        CODE_SIGN_ENTITLEMENTS: Sources/App/NFCRename.entitlements
